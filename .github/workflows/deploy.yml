name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/my-new-site
            sudo git pull
            sudo docker build -t my-new-site .
            sudo docker stop my-new-site-container || true
            sudo docker rm my-new-site-container || true
            sudo docker run -d -p 80:80 --name my-new-site-container my-new-site
